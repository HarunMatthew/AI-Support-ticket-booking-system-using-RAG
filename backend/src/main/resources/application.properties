spring.application.name=ai-customer-support

server.port=8080

# ----- Gemini -----
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash

# ----- Endee Vector Database -----
# mock-mode=true runs a local in-memory cosine-similarity store, so the
# project works out of the box with no external vector DB configured.
# Set to false + configure endee.base-url/endee.api.token to use a real
# Endee deployment.
endee.mock-mode=true
endee.base-url=${ENDEE_BASE_URL:http://localhost:9000}
endee.api.token=${ENDEE_API_TOKEN:}
endee.collection=support_tickets

# ----- CORS -----
frontend.url=http://localhost:4200

logging.level.com.example.support=INFO
