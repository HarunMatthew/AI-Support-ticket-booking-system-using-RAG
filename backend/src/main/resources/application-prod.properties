spring.application.name=ai-customer-support

server.port=${PORT:8080}

# ----- Gemini -----
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ----- Endee Vector Database -----
endee.mock-mode=${ENDEE_MOCK_MODE:true}
endee.base-url=${ENDEE_BASE_URL:http://localhost:9000}
endee.api.token=${ENDEE_API_TOKEN:}
endee.collection=${ENDEE_COLLECTION:support_tickets}

# ----- CORS -----
# Set this to your deployed Angular origin, e.g. https://support.yourdomain.com
frontend.url=${FRONTEND_URL:http://localhost:4200}

logging.level.com.example.support=INFO
logging.level.root=WARN
